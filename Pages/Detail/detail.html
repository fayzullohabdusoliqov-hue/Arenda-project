<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variantga chiqarish</title>
    <link rel="stylesheet" href="../../Global/normalize.css">
    <link rel="stylesheet" href="../../Global/style.css">
    <link rel="stylesheet" href="./detail.css">
</head>
<body>
    <header class="site__header">
        <div class="container header__wrapper">
            <button class="header_btn"><img width="20" height="20" src="../../Photo/icon/sidebar.png" alt=""></button>
            <img src="../../Photo/img/user.png" alt="" class="photo">
        </div>
    </header>
    <aside class="site__sidebar">
        <ul class="sidebar__list">
            <li class="sidebar_item"><img width="20" height="20" src="../../Photo/icon/home.png" alt=""><a href="../../home.html" class="sidebar_link">uy qism</a></li>
            <li class="sidebar_item"><img width="20" height="20" src="../../Photo/icon/work.png" alt=""><a href="../../Pages/Work/work.html" class="sidebar_link">ish qism</a></li>
            <li class="sidebar_item"><img width="20" height="20" src="../../Photo/icon/profit.png" alt=""><a href="../../Pages/Profit/profit.html" class="sidebar_link">foyda qism</a></li>
        </ul>
    </aside>
    <main class="detail__main">
        <div class="container">
            <img class="detail_img" src="" alt="">
        </div>
        <section class="detail">
            <div class="detail__card">
                <div class="detail__header">
                    <div class="detail__title">
                        <h2 class="detail__name"></h2>
                        <p class="detail__owner"></p>
                    </div>

                    <span class="detail__badge">Mahsulot</span>
                </div>

                <div class="detail__line"></div>

                <div class="detail__grid">
                    <div class="detail__item">
                        <span class="detail__label">Sotib olingan sana</span>
                        <strong class="detail__value" id="buyDate"></strong>
                    </div>

                    <div class="detail__item">
                        <span class="detail__label">Sotilgan sana</span>
                        <strong class="detail__value" id="sellDate"></strong>
                    </div>

                    <div class="detail__item">
                        <span class="detail__label">Sotib olish narxi</span>
                        <strong class="detail__value" id="buyPrice"></strong>
                    </div>

                    <div class="detail__item">
                        <span class="detail__label">Oylik to'lovi</span>
                        <strong class="detail__value" id="monthlyPrice"></strong>
                    </div>

                    <div class="detail__item detail__item--full">
                        <span class="detail__label">Telefon raqami</span>
                        <strong class="detail__value" id="phone"></strong>
                    </div>

                    <div class="detail__item detail__item--full">
                        <span class="detail__label">Izoh</span>
                        <p class="detail__comment" id="comment"></p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    
    <script src="./detail.js"></script>
</body>
</html>
